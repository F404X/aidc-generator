name: Audit A404DC encoders
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  symbology-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test QR color and opacity
        run: node --test tests/opacity.test.mjs
      - name: Test payloads and validation
        run: node --test tests/payloads.test.mjs
      - name: Test rMQR and catalog
        run: node --test tests/symbology-options.test.mjs
      - name: Test thumbnail sample selection
        run: node --test tests/thumbnails.test.mjs
      - name: Test all 110 formats with real bwip-js
        run: npm run audit:engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symbology-audit-report
          path: catalog-audit-report.json
          if-no-files-found: ignore
